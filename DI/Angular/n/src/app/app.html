<div>
  <h1>{{title()}}</h1>
  <div>
    @if (estadoBorrado === 'borrado' && heroeBorrado) {
      <p>HEROE BORRADO {{ heroeBorrado }}</p>
    } 
    @else if (estadoBorrado === 'ninguno') {
      <p>No has borrado nada</p>
    } 
    @else {
      <p>En cualquier otro caso</p>
    }
  </div>

  <!-- Lista numerada con los héroes disponibles -->
  <ol>
    @for (heroe of heroes; track heroe) {
      <li>{{ heroe }}</li>
    }
  </ol>

  <!-- Botones anteriores de control -->
  <button (click)="borrarPrimero()">Borrar Primero</button>
  <button (click)="borrarUltimo()">Borrar Último</button>
  <button (click)="borrarTodos()">Borrar Todos</button>
</div>
